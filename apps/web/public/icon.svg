  <g transform="rotate(-12 256 256)">
    <rect x="150" y="104" width="196" height="276" rx="28" fill="#dfe5ff" opacity="0.35"/>
  </g>
  <g transform="rotate(8 256 256)">
    <rect x="166" y="120" width="212" height="296" rx="30" fill="#fffdf8"/>
    <rect x="206" y="178" width="132" height="40" rx="8" fill="#e4492a"/>
    <rect x="252" y="178" width="40" height="178" rx="8" fill="#e4492a"/>
  </g>
</svg>
