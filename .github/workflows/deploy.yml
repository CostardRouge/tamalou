name: Deploy

# Publishes the web app to GitHub Pages on every push to main, so the game can be tried on a phone from a link, and
# the online host (apps/worker) to Cloudflare once the repository has the CLOUDFLARE_ACCOUNT_ID variable and the
# CLOUDFLARE_API_TOKEN secret (ADR-0014), and the LAN server's image to ghcr.io/costardrouge/tamalou (M7).
# One-time setting: Settings → Pages → Source: "GitHub Actions" (until then the deploy job fails with "Not Found").
# The build uses relative paths (vite.config.ts `base: './'`), so it works under /tamalou/ as it is.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 25+ no longer bundles corepack: installed at an exact version, like the Dockerfile's.
      - run: npm install -g corepack@0.36.0 && corepack enable

      - run: pnpm install --frozen-lockfile

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5

  worker:
    name: Deploy to Cloudflare
    # Off until the repository has the CLOUDFLARE_ACCOUNT_ID variable (and the CLOUDFLARE_API_TOKEN secret).
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: cloudflare
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Node 25+ no longer bundles corepack: installed at an exact version, like the Dockerfile's.
      - run: npm install -g corepack@0.36.0 && corepack enable

      - run: pnpm install --frozen-lockfile

      # Builds the web app, then deploys the Worker with it. A custom domain is set in the dashboard; deploys keep it.
      - name: Build and deploy
        run: pnpm worker:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

  image:
    name: Publish the LAN server image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # Plain docker CLI: no third-party action to keep up to date.
      - name: Log in to GitHub's registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      # amd64, for the Optiplex. Another architecture builds the image from the repository (docker compose builds).
      - name: Build and push
        run: |
          docker build -t ghcr.io/costardrouge/tamalou:latest -t ghcr.io/costardrouge/tamalou:${{ github.sha }} .
          docker push --all-tags ghcr.io/costardrouge/tamalou
