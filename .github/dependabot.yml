# Dependabot, the portfolio's shape (COMMON-PROJECT-SPEC.md, C20).
# Trimmed to what this repository has: one pnpm workspace (pnpm goes through
# the npm ecosystem, its lockfile is at the root), the workflows, and the LAN
# server's Dockerfile. docker-compose.yml pins no external tag (it runs our own
# ghcr image), so it has no block.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
      semver-major-days: 30
    open-pull-requests-limit: 3
    groups:
      # Families that only work in step: a major moves the whole family.
      # Listed first, since a dependency goes to the first group it matches.
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
        update-types: [major]
      vite:
        patterns: ['vite', '@vitejs/*']
        update-types: [major]
      vitest:
        patterns: ['vitest', '@vitest/*']
        update-types: [major]
      # Every minor and patch, production and development together:
      # one pull request a month.
      minor-and-patch:
        update-types: [minor, patch]
      security:
        applies-to: security-updates
        patterns: ['*']
    ignore:
      # Node's type definitions follow .nvmrc's major (C14).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # The LAN server's image: raises the exact Node tag the Dockerfile pins (C14).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    ignore:
      # The base image follows .nvmrc's major (C14): a new Node major is
      # raised by hand, with .nvmrc, CI and @types/node in the same PR.
      # Node 25+ no longer ships corepack, which the Dockerfile and CI enable.
      - dependency-name: 'node'
        update-types: ['version-update:semver-major']
